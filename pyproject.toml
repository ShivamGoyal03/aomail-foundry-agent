[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniport-email-agent"
version = "0.1.0"
description = "OmniPort Email Agent: a Microsoft Agent Framework hosted agent for Gmail, Microsoft 365/Outlook and IMAP/SMTP mailboxes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "agent-framework-core>=1.19,<2",
  "agent-framework-foundry>=1.13,<2",
  "agent-framework-foundry-hosting>=1.0.0b260918,<2",
  "azure-identity>=1.19,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "starlette>=1.3.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
omniport-email-agent = "omniport_agent.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omniport_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
files = ["src/omniport_agent"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
